<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBS — Louage Backup Battery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#0d1117;
    --bg-elev:#161b22;
    --bg-elev2:#1e2530;
    --line:#2a323f;
    --amber:#ffb020;
    --amber-dim:#8a6120;
    --teal:#2dd4bf;
    --red:#f0553c;
    --text:#f5f3ed;
    --text-dim:#9aa4b2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:40px;
  }
  h1,h2,h3,.disp{font-family:'Chakra Petch',sans-serif; letter-spacing:.02em;}
  .wrap{max-width:480px; margin:0 auto; padding:18px 16px 60px;}

  /* header */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:4px 0 18px;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand svg{flex-shrink:0;}
  .brand h1{font-size:22px; margin:0; font-weight:700; color:var(--text);}
  .brand small{display:block; font-size:11px; color:var(--text-dim); font-weight:400; letter-spacing:.08em; text-transform:uppercase; margin-top:1px;}

  .roleswitch{display:flex; background:var(--bg-elev); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px;}
  .roleswitch button{
    border:none; background:transparent; color:var(--text-dim); font-family:'Inter'; font-weight:600;
    font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer; transition:.15s;
  }
  .roleswitch button.active{background:var(--amber); color:#1a1200;}

  /* battery gauge */
  .gauge-card{
    background:linear-gradient(145deg, var(--bg-elev2), var(--bg-elev));
    border:1px solid var(--line); border-radius:18px; padding:18px 18px 16px; margin-bottom:16px;
    position:relative; overflow:hidden;
  }
  .gauge-row{display:flex; align-items:center; gap:16px;}
  .gauge-num{font-family:'Chakra Petch'; font-size:34px; font-weight:700; line-height:1;}
  .gauge-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-top:4px;}
  .battery-svg{flex-shrink:0;}

  /* sections */
  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:.09em; color:var(--text-dim); margin:22px 0 10px; font-weight:600;}
  .card{background:var(--bg-elev); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .card + .card{margin-top:10px;}

  label{display:block; font-size:12.5px; color:var(--text-dim); margin:12px 0 6px; font-weight:500;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=tel], select{
    width:100%; background:var(--bg-elev2); border:1px solid var(--line); color:var(--text);
    padding:11px 12px; border-radius:10px; font-size:15px; font-family:'Inter'; outline:none;
  }
  input:focus, select:focus{border-color:var(--amber);}
  .segrow{display:flex; gap:8px;}
  .seg{
    flex:1; text-align:center; padding:10px 8px; border:1px solid var(--line); border-radius:10px;
    background:var(--bg-elev2); color:var(--text-dim); font-size:13.5px; font-weight:600; cursor:pointer; transition:.12s;
  }
  .seg.active{border-color:var(--teal); color:var(--teal); background:rgba(45,212,191,.08);}

  .btn{
    width:100%; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:700;
    font-family:'Inter'; cursor:pointer; margin-top:16px; transition:.12s;
  }
  .btn-primary{background:var(--amber); color:#1a1200;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
  .btn-danger{background:transparent; border:1px solid var(--red); color:var(--red);}
  .btn-small{width:auto; padding:8px 14px; font-size:13px; margin-top:0;}

  .payinfo{
    margin-top:14px; background:var(--bg-elev2); border:1px dashed var(--amber-dim); border-radius:10px;
    padding:12px; font-size:13px; color:var(--text-dim); line-height:1.5;
  }
  .payinfo b{color:var(--amber); font-family:'Chakra Petch'; letter-spacing:.03em;}

  .rental{border-left:3px solid var(--teal); }
  .rental.late{border-left-color:var(--red);}
  .rental-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .rental-id{font-family:'Chakra Petch'; font-weight:700; font-size:14px;}
  .rental-meta{font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.5;}
  .ring-wrap{position:relative; width:52px; height:52px; flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-time{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; font-family:'Chakra Petch';}

  .badge{display:inline-block; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; letter-spacing:.04em; text-transform:uppercase;}
  .badge-fine{background:rgba(240,85,60,.15); color:var(--red);}
  .badge-ok{background:rgba(45,212,191,.15); color:var(--teal);}

  .empty{text-align:center; color:var(--text-dim); font-size:13.5px; padding:26px 10px;}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
    background:var(--amber); color:#1a1200; font-weight:700; font-size:13.5px;
    padding:12px 20px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.4);
    max-width:90%; text-align:center; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  .stockctl{display:flex; align-items:center; gap:10px; justify-content:center; margin-top:10px;}
  .stockctl button{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--bg-elev2);
    color:var(--text); font-size:18px; cursor:pointer; font-family:'Chakra Petch';
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const MONCASH = "4426-8553";
const NATCASH = "3223-5457";
const RENTAL_HOURS = 24;
const FINE = 50;


// ====== CONFIGURATION FIREBASE ======
// Remplace les valeurs ci-dessous par celles de TON projet Firebase
// (Console Firebase > Paramètres du projet > Tes applications > Config SDK)
const firebaseConfig = {
  apiKey: "AIzaSyDTs2q_oj538606Hu1wid7wrISgfkOpBqY",
  authDomain: "tbs-de5fe.firebaseapp.com",
  projectId: "tbs-de5fe",
  storageBucket: "tbs-de5fe.firebasestorage.app",
  messagingSenderId: "313525773672",
  appId: "1:313525773672:web:cb9f1def8ea136c768a2dd"
};
// =====================================

let db = null;
let firebaseReady = false;

function initFirebase(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
  }catch(e){
    console.error(e);
    showConfigWarning();
  }
}

function showConfigWarning(){
  document.getElementById('app').innerHTML = `
    <div style="max-width:480px;margin:60px auto;padding:24px;background:#161b22;border:1px solid #f0553c;border-radius:14px;color:#f5f3ed;font-family:'Inter',sans-serif;">
      <h3 style="color:#f0553c;margin-top:0;">Configuration Firebase requise</h3>
      <p style="font-size:14px;line-height:1.6;color:#9aa4b2;">
        Ouvre le fichier HTML, trouve la section <b>firebaseConfig</b> près du début du script,
        et remplace les valeurs par celles de ton propre projet Firebase (gratuit).
        Sans ça, l'application ne peut pas sauvegarder les réservations une fois hébergée en dehors de Claude.
      </p>
    </div>`;
}

let state = null;
let role = "client";
let form = { mode:"retrait", pay:"moncash", name:"", phone:"", address:"" };
let lookupPhone = "";

const DEFAULT_STATE = {
  batteries: Array.from({length:8}, (_,i)=>({id:'PB-'+String(i+1).padStart(2,'0'), status:'disponible'})),
  rentals: []
};

function listenState(){
  db.collection('tbs').doc('state').onSnapshot(async (docSnap) => {
    if(docSnap.exists){
      state = docSnap.data();
    } else {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      await saveState();
    }
    render();
  }, (err) => {
    console.error(err);
    showToast("Erreur de connexion à la base de données");
  });
}

async function saveState(){
  try{
    await db.collection('tbs').doc('state').set(state);
  }catch(e){ showToast("Erreur de sauvegarde"); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

function fmtRemaining(ms){
  const late = ms < 0;
  const abs = Math.abs(ms);
  const h = Math.floor(abs/3600000);
  const m = Math.floor((abs%3600000)/60000);
  return (late? "-" : "") + h + "h" + String(m).padStart(2,'0');
}

function batteryGaugeSVG(pct){
  const w = 68, h = 34, fillW = Math.max(0,(w-8))*pct;
  const color = pct > .4 ? "var(--teal)" : pct > .15 ? "var(--amber)" : "var(--red)";
  return `<svg class="battery-svg" width="${w+6}" height="${h}" viewBox="0 0 ${w+6} ${h}">
    <rect x="1" y="1" width="${w}" height="${h-2}" rx="6" fill="none" stroke="#3a4453" stroke-width="2"/>
    <rect x="${w+1}" y="${h/2-6}" width="5" height="12" rx="2" fill="#3a4453"/>
    <rect x="5" y="5" width="${fillW}" height="${h-10}" rx="3" fill="${color}"/>
  </svg>`;
}

function ringSVG(pct, late){
  const r = 22, c = 2*Math.PI*r;
  const dash = c * Math.min(1,Math.max(0,pct));
  const color = late ? "var(--red)" : pct > .6 ? "var(--amber)" : "var(--teal)";
  return `<svg width="52" height="52" viewBox="0 0 52 52">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="#2a323f" stroke-width="4"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="4"
      stroke-dasharray="${dash} ${c}" stroke-linecap="round"/>
  </svg>`;
}

function activeRentals(){ return state.rentals.filter(r=>r.status==='active'); }
function availableCount(){ return state.batteries.filter(b=>b.status==='disponible').length; }

function payLabel(p){ return p==='moncash' ? 'MonCash' : p==='natcash' ? 'NatCash' : 'Cash'; }
function modeLabel(m){ return m==='livraison' ? 'Livraison' : 'Retrait sur place'; }

async function submitBooking(){
  if(!form.name.trim() || !form.phone.trim()){ showToast("Nom et numéro requis"); return; }
  if(form.mode==='livraison' && !form.address.trim()){ showToast("Adresse requise pour la livraison"); return; }
  const bat = state.batteries.find(b=>b.status==='disponible');
  if(!bat){ showToast("Aucune batterie disponible pour le moment"); return; }
  bat.status = 'loué';
  const now = Date.now();
  const rental = {
    id: 'L-' + now.toString().slice(-6),
    batteryId: bat.id,
    name: form.name.trim(),
    phone: form.phone.trim(),
    mode: form.mode,
    address: form.mode==='livraison' ? form.address.trim() : '',
    pay: form.pay,
    start: now,
    due: now + RENTAL_HOURS*3600000,
    status: 'active',
    returned: null,
    fine: 0
  };
  state.rentals.unshift(rental);
  await saveState();
  form.name=''; form.phone=''; form.address='';
  lookupPhone = rental.phone;
  showToast("Réservation confirmée · " + bat.id);
  render();
}

async function markReturned(rentalId){
  const rental = state.rentals.find(r=>r.id===rentalId);
  if(!rental) return;
  const now = Date.now();
  rental.returned = now;
  rental.status = 'retourné';
  rental.fine = now > rental.due ? FINE : 0;
  const bat = state.batteries.find(b=>b.id===rental.batteryId);
  if(bat) bat.status = 'disponible';
  await saveState();
  showToast(rental.fine ? "Retour enregistré · amende " + FINE + " G" : "Retour enregistré");
  render();
}

async function adjustStock(delta){
  if(delta > 0){
    const n = state.batteries.length + 1;
    state.batteries.push({id:'PB-'+String(n).padStart(2,'0'), status:'disponible'});
  } else {
    const idx = [...state.batteries].reverse().findIndex(b=>b.status==='disponible');
    if(idx===-1){ showToast("Impossible: batterie en location"); return; }
    const realIdx = state.batteries.length - 1 - idx;
    state.batteries.splice(realIdx,1);
  }
  await saveState();
  render();
}

function setRole(r){ role = r; render(); }
function setForm(k,v,el){ form[k]=v; renderPreserveFocus(el); }
function setLookup(v,el){ lookupPhone = v; renderPreserveFocus(el); }

function renderPreserveFocus(el){
  const field = el ? el.getAttribute('data-field') : null;
  const pos = el ? el.selectionStart : null;
  render();
  if(field){
    const revived = document.querySelector(`[data-field="${field}"]`);
    if(revived){
      revived.focus();
      if(pos !== null && revived.setSelectionRange){
        try{ revived.setSelectionRange(pos, pos); }catch(e){}
      }
    }
  }
}

const OWNER_PIN = "6002";
let ownerUnlocked = false;
let pinEntry = "";
let pinError = false;

function setPinEntry(v,el){ pinEntry = v.replace(/[^0-9]/g,'').slice(0,8); pinError = false; renderPreserveFocus(el); }
function submitPin(){
  if(pinEntry === OWNER_PIN){
    ownerUnlocked = true; pinEntry = ""; pinError = false;
  } else {
    pinError = true; pinEntry = "";
  }
  render();
}
function lockOwner(){ ownerUnlocked = false; role = 'client'; render(); }

function pinGateHTML(){
  return `
  <div class="card" style="margin-top:40px; text-align:center; padding:28px 18px;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" style="margin-bottom:10px;">
      <rect x="5" y="10" width="14" height="10" rx="2" stroke="#ffb020" stroke-width="1.8"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#ffb020" stroke-width="1.8"/>
    </svg>
    <h3 style="margin:0 0 4px;">Accès Propriétaire</h3>
    <div style="font-size:13px; color:var(--text-dim); margin-bottom:16px;">Entre le code pour continuer</div>
    <input type="password" inputmode="numeric" style="text-align:center; letter-spacing:.3em; font-size:20px;"
      value="${pinEntry}" oninput="setPinEntry(this.value, this)" data-field="pin"
      onkeydown="if(event.key==='Enter') submitPin()" placeholder="••••" autofocus>
    ${pinError ? `<div style="color:var(--red); font-size:12.5px; margin-top:10px;">Code incorrect</div>` : ``}
    <button class="btn btn-primary" onclick="submitPin()">Déverrouiller</button>
  </div>`;
}

function headerHTML(){
  return `
  <div class="topbar">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <rect x="4" y="6" width="22" height="22" rx="6" fill="none" stroke="#ffb020" stroke-width="2.5"/>
        <rect x="26" y="13" width="4" height="8" rx="1.5" fill="#ffb020"/>
        <path d="M17 11 L12 19 L16 19 L14 25 L21 16 L17 16 Z" fill="#ffb020"/>
      </svg>
      <div>
        <h1>TBS</h1>
        <small>Louage backup battery</small>
      </div>
    </div>
    <div class="roleswitch">
      <button class="${role==='client'?'active':''}" onclick="setRole('client')">Client</button>
      <button class="${role==='owner'?'active':''}" onclick="setRole('owner')">Propriétaire</button>
    </div>
  </div>`;
}

function clientHTML(){
  const avail = availableCount();
  const total = state.batteries.length;
  const pct = total ? avail/total : 0;
  const myRentals = state.rentals.filter(r => lookupPhone && r.phone === lookupPhone);

  const payBlock = form.pay==='cash'
    ? `<div class="payinfo">Paiement <b>cash</b> à ${form.mode==='livraison'?'la livraison':'la remise'} du power bank.</div>`
    : `<div class="payinfo">Envoie le paiement sur <b>${form.pay==='moncash'?'MonCash '+MONCASH:'NatCash '+NATCASH}</b>, puis confirme ta réservation. Le power bank sera préparé après confirmation.</div>`;

  return `
  <div class="gauge-card">
    <div class="gauge-row">
      ${batteryGaugeSVG(pct)}
      <div>
        <div class="gauge-num">${avail}<span style="font-size:16px;color:var(--text-dim);"> / ${total}</span></div>
        <div class="gauge-label">Power banks disponibles</div>
      </div>
    </div>
  </div>

  <div class="section-title">Réserver un power bank</div>
  <div class="card">
    <label>Nom</label>
    <input type="text" value="${form.name}" oninput="setForm('name', this.value, this)" data-field="name" placeholder="Ton nom">
    <label>Numéro de téléphone</label>
    <input type="tel" value="${form.phone}" oninput="setForm('phone', this.value, this)" data-field="phone" placeholder="Ex: 3712-3456">

    <label>Mode</label>
    <div class="segrow">
      <div class="seg ${form.mode==='retrait'?'active':''}" onclick="setForm('mode','retrait')">Retrait sur place</div>
      <div class="seg ${form.mode==='livraison'?'active':''}" onclick="setForm('mode','livraison')">Livraison</div>
    </div>
    ${form.mode==='livraison' ? `
    <label>Adresse de livraison</label>
    <input type="text" value="${form.address}" oninput="setForm('address', this.value, this)" data-field="address" placeholder="Adresse complète">` : ``}

    <label>Paiement</label>
    <div class="segrow">
      <div class="seg ${form.pay==='moncash'?'active':''}" onclick="setForm('pay','moncash')">MonCash</div>
      <div class="seg ${form.pay==='natcash'?'active':''}" onclick="setForm('pay','natcash')">NatCash</div>
      <div class="seg ${form.pay==='cash'?'active':''}" onclick="setForm('pay','cash')">Cash</div>
    </div>
    ${payBlock}
    <button class="btn btn-primary" onclick="submitBooking()">${avail>0 ? 'Réserver — 24h de location' : 'Aucune batterie disponible'}</button>
  </div>

  <div class="section-title">Mes locations</div>
  <div class="card">
    <label>Retrouver avec mon numéro</label>
    <input type="tel" value="${lookupPhone}" oninput="setLookup(this.value, this)" data-field="lookup" placeholder="Ton numéro de téléphone">
  </div>
  ${myRentals.length===0 ? `<div class="empty">Aucune location trouvée pour ce numéro.</div>` :
    myRentals.map(r=>rentalCardHTML(r,false)).join('')}
  `;
}

function fmtHour(ts){
  const d = new Date(ts);
  let h = d.getHours();
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if(h === 0) h = 12;
  return h + 'h' + ampm;
}
function fmtDate(ts){
  const d = new Date(ts);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return 'Le ' + dd + '/' + mm + '/' + d.getFullYear();
}

function rentalCardHTML(r, ownerView){
  const now = Date.now();
  const isActive = r.status==='active';
  const remaining = r.due - now;
  const late = isActive && remaining < 0;
  const pct = isActive ? Math.max(0, Math.min(1, remaining / (RENTAL_HOURS*3600000))) : 0;

  const statusBadge = !isActive
    ? (r.fine ? `<span class="badge badge-fine">Amende ${FINE}G</span>` : `<span class="badge badge-ok">Rendu à temps</span>`)
    : (late ? `<span class="badge badge-fine">En retard</span>` : `<span class="badge badge-ok">En cours</span>`);

  return `
  <div class="card rental ${late?'late':''}">
    <div class="rental-top">
      <div>
        <div class="rental-id">${r.id} · ${r.batteryId}</div>
        <div class="rental-meta">
          ${ownerView ? r.name+' · '+r.phone+'<br>' : ''}
          ${modeLabel(r.mode)}${r.address ? ' — '+r.address : ''}<br>
          ${fmtDate(r.start)} · ${fmtHour(r.start)}-${fmtHour(r.due)}<br>
          ${!isActive && r.returned ? 'Rendu le '+fmtDate(r.returned)+' à '+fmtHour(r.returned)+'<br>' : ''}
          Paiement: ${payLabel(r.pay)} ${statusBadge}
        </div>
      </div>
      ${isActive ? `
      <div class="ring-wrap">
        ${ringSVG(pct, late)}
        <div class="ring-time" style="color:${late?'var(--red)':'var(--text)'}">${fmtRemaining(remaining)}</div>
      </div>` : ``}
    </div>
    ${ownerView && isActive ? `<button class="btn btn-primary btn-small" style="margin-top:12px;" onclick="markReturned('${r.id}')">Marquer comme rendu</button>` : ``}
  </div>`;
}

function ownerHTML(){
  const avail = availableCount();
  const total = state.batteries.length;
  const pct = total ? avail/total : 0;
  const active = activeRentals();
  const history = state.rentals.filter(r=>r.status==='retourné').slice(0,10);

  return `
  <div class="gauge-card">
    <div class="gauge-row">
      ${batteryGaugeSVG(pct)}
      <div>
        <div class="gauge-num">${avail}<span style="font-size:16px;color:var(--text-dim);"> / ${total}</span></div>
        <div class="gauge-label">En stock disponible</div>
      </div>
    </div>
    <div class="stockctl">
      <button onclick="adjustStock(-1)">−</button>
      <span style="font-size:12.5px;color:var(--text-dim);">Gérer le parc (${total} unités)</span>
      <button onclick="adjustStock(1)">+</button>
    </div>
  </div>

  <div class="section-title">Locations en cours (${active.length})</div>
  ${active.length===0 ? `<div class="empty">Aucune location active.</div>` :
    active.map(r=>rentalCardHTML(r,true)).join('')}

  <div class="section-title">Historique récent</div>
  ${history.length===0 ? `<div class="empty">Aucun retour pour l'instant.</div>` :
    history.map(r=>rentalCardHTML(r,true)).join('')}
  `;
}

function render(){
  if(!state) return;
  const app = document.getElementById('app');
  let body;
  if(role==='client'){
    body = clientHTML();
  } else if(!ownerUnlocked){
    body = pinGateHTML();
  } else {
    body = `<div style="display:flex; justify-content:flex-end; margin-top:-6px;">
      <button class="btn btn-ghost btn-small" onclick="lockOwner()">🔒 Verrouiller</button>
    </div>` + ownerHTML();
  }
  app.innerHTML = headerHTML() + body;
}

(function init(){
  initFirebase();
  if(firebaseReady){
    listenState();
    setInterval(render, 30000); // rafraîchit les comptes à rebours
  }
})();
</script>
</body>
</html>
